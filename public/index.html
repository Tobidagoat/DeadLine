<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline: JLPT drill</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-bg" id="loginBg"></div>
<div class="wrap">
  <div class="topbar" id="topbar">
    <h1>Deadline <span class="accent">·</span> JLPT drill</h1>
    <div class="topbar-actions">
      <span class="status-pill" id="statusPill" style="display:none;"></span>
      <button class="streak-badge" id="streakBadge" title="Stats & streak" style="display:none;"></button>
      <button class="icon-btn" id="notifBtn" style="display:none;" title="Notifications">🔔</button>
      <button class="icon-btn" id="menuBtn" style="display:none;" title="Menu">☰</button>
    </div>
  </div>
  <div class="storage-note" id="storageNote" style="display:none;"></div>

  <div id="app"></div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
